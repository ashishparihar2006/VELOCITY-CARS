<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Velocity Motors</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        .auth-wrapper {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1503376712351-1c4b22c7104b?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 8px;
            border-top: 3px solid #e50914;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .auth-box h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 300;
        }
        .auth-box p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .auth-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
            font-family: inherit;
        }
        .auth-input:focus {
            outline: none;
            border-color: #e50914;
        }
        .auth-box .btn-primary {
            width: 100%;
            margin-top: 10px;
        }
        .auth-footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }
        .auth-footer a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar" style="background: rgba(10, 10, 10, 0.95);">
        <a href="index.html" class="logo">VELOCITY</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="models.html">Models</a></li>
            <li><a href="innovation.html">Innovation</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
        <div class="nav-actions" style="display: flex; align-items: center; gap: 20px;">
            <a href="profile.html" style="font-weight: 500; font-size: 0.9rem; color: #e50914;">Profile / Login</a>
            <a href="cart.html" style="font-weight: 500; font-size: 0.9rem;">Cart (1)</a>
            <a href="index.html#contact" class="btn-nav">Book Test Drive</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p>Access your configurations, warranties, and service history.</p>
            
            <form action="profile.html" method="GET">
                <input type="email" class="auth-input" placeholder="Email Address" required>
                <input type="password" class="auth-input" placeholder="Password" required>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            
            <div class="auth-footer">
                Don't have a Velocity account? <a href="#">Create one</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
