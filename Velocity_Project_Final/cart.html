<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Velocity Motors</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        .cart-wrapper {
            padding: 120px 10% 80px;
            min-height: 100vh;
            background-color: #0a0a0a;
        }
        .cart-header {
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        .cart-header h1 {
            font-size: 2.5rem;
            font-weight: 300;
        }
        .cart-item {
            display: flex;
            background: #111;
            padding: 30px;
            border-radius: 8px;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
        }
        .cart-item img {
            width: 300px;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .cart-details {
            flex: 1;
        }
        .cart-details h3 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .cart-details p {
            color: #888;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .cart-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin-top: 15px;
        }
        .cart-summary {
            background: #111;
            padding: 30px;
            border-radius: 8px;
            text-align: right;
        }
        .cart-summary h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .cart-summary .total {
            font-size: 2.5rem;
            color: #e50914;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar" style="background: rgba(10, 10, 10, 0.95);">
        <a href="index.html" class="logo">VELOCITY</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="models.html">Models</a></li>
            <li><a href="innovation.html">Innovation</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
        <div class="nav-actions" style="display: flex; align-items: center; gap: 20px;">
            <a href="profile.html" style="font-weight: 500; font-size: 0.9rem;">Profile / Login</a>
            <a href="cart.html" style="font-weight: 500; font-size: 0.9rem; color: #e50914;">Cart (1)</a>
            <a href="index.html#contact" class="btn-nav">Book Test Drive</a>
        </div>
    </nav>

    <div class="cart-wrapper">
        <div class="cart-header">
            <h1>Your Reservations</h1>
        </div>
        
        <div class="cart-item">
            <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Configured Car">
            <div class="cart-details">
                <h3>Velocity S-Type</h3>
                <p><strong>Powertrain:</strong> Performance Dual Motor (AWD)</p>
                <p><strong>Exterior Paint:</strong> Phantom Black</p>
                <p><strong>Interior Trim:</strong> Vegan Obsidian Black</p>
                <div class="cart-price">$95,000</div>
            </div>
            <div>
                <button class="btn-secondary" style="color: #e50914; border-color: #333;">Remove</button>
            </div>
        </div>

        <div class="cart-summary">
            <h3>Estimated Total Due Today (Deposit)</h3>
            <div class="total">$1,000</div>
            <button class="btn-primary" style="padding: 15px 40px; font-size: 1.1rem;">Proceed to Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
